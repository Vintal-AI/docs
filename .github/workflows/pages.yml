name: Publikacja dokumentacji

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Pobranie dokumentacji
        uses: actions/checkout@v7
      - name: Przygotowanie Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Przygotowanie GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Przygotowanie PDF z aktualnej treści
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends fonts-dejavu-core
          python3 -m venv "$RUNNER_TEMP/docs-pdf"
          "$RUNNER_TEMP/docs-pdf/bin/pip" install --requirement scripts/requirements-pdf.txt
          "$RUNNER_TEMP/docs-pdf/bin/python" scripts/build_pdf.py
      - name: Budowanie strony
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --trace
        env:
          JEKYLL_ENV: production
      - name: Zapis plików strony
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikacja na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
